name: QA/QC Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - demo
      - 'feature/**'
  workflow_dispatch:
    inputs:
      run_load_smoke:
        description: 'Run k6 Scenario A against BASE_URL'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      base_url:
        description: 'Target API base URL for smoke/load jobs'
        required: false
        default: ''

jobs:
  backend-qa:
    name: Backend QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        run: mvn verify

  frontend-qa:
    name: Frontend QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  smoke:
    name: Deployed Smoke
    runs-on: ubuntu-latest
    needs:
      - backend-qa
      - frontend-qa
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run smoke tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASS: ${{ secrets.DEMO_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: bash tests/smoke/main.sh

  load-smoke:
    name: Load Smoke Scenario A
    runs-on: ubuntu-latest
    needs:
      - backend-qa
      - frontend-qa
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_load_smoke == 'true' && inputs.base_url != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run Scenario A
        env:
          BASE_URL: ${{ inputs.base_url }}
          VUS: 20
          RAMP_DURATION: 30s
          HOLD_DURATION: 1m
        run: k6 run tests/load/scenario-a-browse.js
