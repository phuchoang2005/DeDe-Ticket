upstream backend_pool {
    # least_conn beats round-robin when request durations are uneven
    # (e.g., /v1/orders/{id}/pay is slower than /v1/health).
    least_conn;

    server backend1:8080 max_fails=3 fail_timeout=10s;
    server backend2:8080 max_fails=3 fail_timeout=10s;
    server backend3:8080 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

log_format lb_upstream '$remote_addr - "$request" $status '
                       'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log lb_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $http_x_request_id;

    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    proxy_connect_timeout 2s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;

    # Open-source nginx only retries non-idempotent methods (POST/PUT/PATCH)
    # if "non_idempotent" is added — we deliberately omit it so state-changing
    # requests are NOT silently replayed. Idempotency-Key (ADR-0006) handles
    # explicit client retries.
    proxy_next_upstream         error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries   3;
    proxy_next_upstream_timeout 10s;

    location = /lb/health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://backend_pool;
    }
}
