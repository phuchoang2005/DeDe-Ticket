spring:
  application:
    name: event-ticketing-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-please-override-in-prod-32+chars!!}
    ttl-minutes: ${APP_JWT_TTL_MINUTES:1440}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
