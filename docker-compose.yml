x-backend: &backend
  build:
    context: ./backend
  restart: always
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &backend-env
    SPRING_PROFILES_ACTIVE: prod
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USERNAME}
    SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    APP_JWT_SECRET: ${APP_JWT_SECRET}
    APP_JWT_TTL_MINUTES: ${APP_JWT_TTL_MINUTES:-1440}
    SERVER_PORT: 8080
  expose:
    - "8080"
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 40s

services:
  mysql:
    image: mysql:8
    container_name: mysql_prod
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis_prod
    restart: always
    # Durability: AOF + everysec fsync (≤1s loss on crash). RDB kept as coarse backup.
    # volatile-lru evicts only keys with a TTL — rate-limit + idempotency entries
    # are written with TTLs, advisory cache too. Keys without TTL (none today) stay.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - "64mb"
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend1:
    <<: *backend
    container_name: backend1_prod
  backend2:
    <<: *backend
    container_name: backend2_prod
  backend3:
    <<: *backend
    container_name: backend3_prod
  backend4:
    <<: *backend
    container_name: backend4_prod

  lb:
    image: nginx:alpine
    container_name: lb_prod
    restart: always
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
      backend4:
        condition: service_healthy
    volumes:
      - ./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/lb/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: frontend_prod
    restart: always
    depends_on:
      lb:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  mysql_data:
  redis_data:
