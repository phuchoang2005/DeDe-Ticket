SubmitFeedbackRequest:
  type: object
  properties:
    eventId: { type: integer, format: int64, nullable: true }
    category:
      type: string
      enum: [GENERAL, EVENT, PAYMENT, BUG_REPORT, SUGGESTION]
    subject: { type: string }
    body: { type: string }
    rating:
      type: integer
      minimum: 1
      maximum: 5
      nullable: true
FeedbackView:
  type: object
  properties:
    id: { type: integer, format: int64 }
    userId: { type: integer, format: int64 }
    userEmail: { type: string }
    eventId: { type: integer, format: int64, nullable: true }
    eventTitle: { type: string, nullable: true }
    category: { type: string }
    subject: { type: string }
    body: { type: string }
    rating: { type: integer, nullable: true }
    status:
      type: string
      enum: [NEW, READ, RESOLVED]
    createdAt: { type: string, format: date-time }
    resolvedAt: { type: string, format: date-time, nullable: true }
    adminNote: { type: string, nullable: true }
PageMeta:
  type: object
  properties:
    page: { type: integer }
    limit: { type: integer }
    total: { type: integer, format: int64 }
    hasMore: { type: boolean }
FeedbackPage:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/FeedbackView'
    page:
      $ref: '#/PageMeta'
UpdateStatusRequest:
  type: object
  properties:
    status:
      type: string
      enum: [NEW, READ, RESOLVED]
    adminNote: { type: string }
FeedbackSummary:
  type: object
  properties:
    total: { type: integer, format: int64 }
    newCount: { type: integer, format: int64 }
    readCount: { type: integer, format: int64 }
    resolvedCount: { type: integer, format: int64 }
    avgRating: { type: number, nullable: true }
