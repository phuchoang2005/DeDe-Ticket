NotificationView:
  type: object
  properties:
    id: { type: integer, format: int64 }
    type: { type: string }
    title: { type: string }
    content: { type: string }
    channel: { type: string }
    status: { type: string }
    linkUrl: { type: string, nullable: true }
    sentAt: { type: string, format: date-time, nullable: true }
    readAt: { type: string, format: date-time, nullable: true }
    createdAt: { type: string, format: date-time }
InboxResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/NotificationView'
    unreadCount: { type: integer, format: int64 }
    countsByType:
      type: object
      additionalProperties:
        type: integer
        format: int64
UnreadCountResponse:
  type: object
  properties:
    unreadCount: { type: integer, format: int64 }
