CreateOrderRequest:
  type: object
  required: [eventId, seatIds]
  properties:
    eventId: { type: integer, format: int64 }
    seatIds:
      type: array
      items: { type: integer, format: int64 }
PayRequest:
  type: object
  required: [method]
  properties:
    method:
      type: string
      enum: [MOMO, VNPAY, MOCK]
OrderItemView:
  type: object
  properties:
    id: { type: integer, format: int64 }
    eventSeatId: { type: integer, format: int64 }
    rowLabel: { type: string }
    seatNumber: { type: string }
    section: { type: string }
    price: { type: number }
OrderView:
  type: object
  properties:
    id: { type: integer, format: int64 }
    eventId: { type: integer, format: int64 }
    eventTitle: { type: string }
    status:
      type: string
      enum: [PENDING_PAYMENT, PAID, CANCELLED, EXPIRED]
    paymentMethod: { type: string, nullable: true }
    totalAmount: { type: number }
    createdAt: { type: string, format: date-time }
    paidAt:
      type: string
      format: date-time
      nullable: true
    items:
      type: array
      items:
        $ref: '#/OrderItemView'
