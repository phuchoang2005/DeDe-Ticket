orders:
  post:
    tags: [Orders]
    summary: Create an order and lock selected seats
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateOrderRequest'
    responses:
      '201':
        description: Order created with seats held for checkout
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/OrderView'
  get:
    tags: [Orders]
    summary: List my orders
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Authenticated user's orders
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/OrderView'
orderById:
  get:
    tags: [Orders]
    summary: Get one of my orders
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: Order detail
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/OrderView'
  delete:
    tags: [Orders]
    summary: Cancel one of my pending orders
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '204':
        description: Order cancelled and held seats released
orderPay:
  post:
    tags: [Orders]
    summary: Pay for an order
    description: Supports `MOMO`, `VNPAY`, and `MOCK` methods. Successful payment issues tickets and creates an in-app notification.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/PayRequest'
    responses:
      '200':
        description: Paid order with ticket issuance completed
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/OrderView'
