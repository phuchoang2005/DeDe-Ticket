events:
  get:
    tags: [Events]
    summary: List published events
    description: Returns a paged envelope used by the public event listing.
    parameters:
      - name: page
        in: query
        schema: { type: integer, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, default: 12 }
      - name: category
        in: query
        schema: { type: string }
      - name: q
        in: query
        description: Case-insensitive title/location search.
        schema: { type: string }
    responses:
      '200':
        description: Paged event summaries
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/EventPage'
trendingEvents:
  get:
    tags: [Events]
    summary: List trending published events
    description: PUBLISHED future events ranked by total capacity descending, then start time ascending.
    parameters:
      - name: limit
        in: query
        schema: { type: integer, default: 6 }
    responses:
      '200':
        description: Event summaries
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/EventSummary'
eventById:
  get:
    tags: [Events]
    summary: Get public event detail
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: Event detail
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/EventDetail'
eventSeats:
  get:
    tags: [Events]
    summary: Get event seat map
    description: Includes seat status and `lockedUntil` so the frontend can render hold countdowns.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: Seat map
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/SeatMap'
