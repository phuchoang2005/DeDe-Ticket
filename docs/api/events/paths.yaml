events:
  get:
    tags:
      - Events
    summary: List all upcoming events
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
    responses:
      '200':
        description: A paginated list of events
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../events/schemas.yaml#/Event'
                total:
                  type: integer
  post:
    tags:
      - Events
    summary: Create a new event (Organizer)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../events/schemas.yaml#/EventCreateRequest'
    responses:
      '201':
        description: Event created successfully
trendingEvents:
  get:
    tags:
      - Events
    summary: List trending PUBLISHED events
    description: |
      Returns up to `limit` published upcoming events ranked by total seat
      capacity (DESC) then start time (ASC). Used by the home page to surface
      large-scale events that are happening soonest.
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 6
          maximum: 20
    responses:
      '200':
        description: List of trending event summaries
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../events/schemas.yaml#/Event'
eventById:
  get:
    tags:
      - Events
    summary: Get event details
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Event details
        content:
          application/json:
            schema:
              $ref: '../events/schemas.yaml#/Event'
eventTicketTypes:
  get:
    tags:
      - Events
    summary: Get ticket types for an event
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: List of ticket types
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../events/schemas.yaml#/TicketType'
eventSeating:
  get:
    tags:
      - Events
    summary: Get event seating chart mapped to venue
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Seating chart layout and availability
        content:
          application/json:
            schema:
              $ref: '../events/schemas.yaml#/SeatingChart'
