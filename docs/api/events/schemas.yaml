Event:
  type: object
  properties:
    id:
      type: integer
    title:
      type: string
    description:
      type: string
    location:
      type: string
    start_time:
      type: string
      format: date-time
    end_time:
      type: string
      format: date-time
    status:
      type: string
    created_by:
      type: integer
EventCreateRequest:
  type: object
  required:
    - title
    - start_time
    - end_time
  properties:
    title:
      type: string
    description:
      type: string
    location:
      type: string
    start_time:
      type: string
      format: date-time
    end_time:
      type: string
      format: date-time
    category_ids:
      type: array
      items:
        type: integer
TicketType:
  type: object
  properties:
    id:
      type: integer
    name:
      type: string
    price:
      type: number
    quantity:
      type: integer
    sold_quantity:
      type: integer
Seat:
  type: object
  properties:
    id:
      type: integer
    row_label:
      type: string
    seat_number:
      type: string
    event_seat_id:
      type: integer
    status:
      type: string
      enum: [AVAILABLE, LOCKED, SOLD]
    locked_until:
      type: string
      format: date-time
Section:
  type: object
  properties:
    id:
      type: integer
    name:
      type: string
    seats:
      type: array
      items:
        $ref: '#/Seat'
SeatingChart:
  type: object
  properties:
    venue_id:
      type: integer
    venue_name:
      type: string
    sections:
      type: array
      items:
        $ref: '#/Section'
