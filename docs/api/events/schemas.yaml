Event:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    startTime:
      type: string
      format: date-time
    endTime:
      type: string
      format: date-time
    location:
      type: string
    status:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED]
EventCreateRequest:
  type: object
  required:
    - name
    - startTime
    - location
    - capacity
  properties:
    name:
      type: string
    description:
      type: string
    startTime:
      type: string
      format: date-time
    endTime:
      type: string
      format: date-time
    location:
      type: string
    capacity:
      type: integer
      description: Up to 50,000 tickets
SeatingChart:
  type: object
  properties:
    zones:
      type: array
      items:
        type: object
        properties:
          zoneId:
            type: string
          name:
            type: string
          price:
            type: number
          availableSeats:
            type: integer
