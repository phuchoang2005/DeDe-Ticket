CategoryRef:
  type: object
  properties:
    id: { type: integer, format: int64 }
    name: { type: string }
PageMeta:
  type: object
  properties:
    page: { type: integer }
    limit: { type: integer }
    total: { type: integer, format: int64 }
    hasMore: { type: boolean }
EventSummary:
  type: object
  properties:
    id: { type: integer, format: int64 }
    title: { type: string }
    location: { type: string }
    imageUrl: { type: string }
    categories:
      type: array
      items:
        $ref: '#/CategoryRef'
    organizer: { type: string }
    startTime: { type: string, format: date-time }
    endTime: { type: string, format: date-time }
    status: { type: string, example: PUBLISHED }
    priceFrom: { type: number }
    availableSeats: { type: integer }
    totalSeats: { type: integer }
EventPage:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/EventSummary'
    page:
      $ref: '#/PageMeta'
EventDetail:
  allOf:
    - $ref: '#/EventSummary'
    - type: object
      properties:
        description: { type: string }
        priceTo: { type: number }
SeatItem:
  type: object
  properties:
    id: { type: integer, format: int64 }
    rowLabel: { type: string }
    seatNumber: { type: string }
    section: { type: string }
    price: { type: number }
    status:
      type: string
      enum: [AVAILABLE, LOCKED, SOLD]
    lockedUntil:
      type: string
      format: date-time
      nullable: true
SeatMap:
  type: object
  properties:
    eventId: { type: integer, format: int64 }
    seats:
      type: array
      items:
        $ref: '#/SeatItem'
