adminAudit:
  get:
    tags: [Audit]
    summary: List audit rows
    description: Requires `ROLE_ADMIN`.
    security:
      - bearerAuth: []
    parameters:
      - name: entity
        in: query
        schema: { type: string }
      - name: entityId
        in: query
        schema: { type: integer, format: int64 }
      - name: userId
        in: query
        schema: { type: integer, format: int64 }
      - name: page
        in: query
        schema: { type: integer, default: 0 }
      - name: size
        in: query
        schema: { type: integer, default: 50, maximum: 200 }
    responses:
      '200':
        description: Audit rows
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/AuditView'
