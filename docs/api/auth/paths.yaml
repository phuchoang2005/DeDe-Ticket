register:
  post:
    tags: [Authentication]
    summary: Register and issue a JWT
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/RegisterRequest'
    responses:
      '200':
        description: User registered and authenticated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AuthResponse'
login:
  post:
    tags: [Authentication]
    summary: Login and issue a JWT
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/LoginRequest'
    responses:
      '200':
        description: Credentials accepted
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AuthResponse'
