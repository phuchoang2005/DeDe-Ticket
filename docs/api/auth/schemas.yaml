RegisterRequest:
  type: object
  required: [email, password, fullName]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 6
      maxLength: 100
    fullName:
      type: string
      maxLength: 255
    phone:
      type: string
      maxLength: 50
LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
UserResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    email:
      type: string
      format: email
    fullName:
      type: string
    phone:
      type: string
    roles:
      type: array
      items:
        type: string
        example: ROLE_USER
AuthResponse:
  type: object
  properties:
    token:
      type: string
    expiresInMinutes:
      type: integer
      format: int64
    user:
      $ref: '#/UserResponse'
