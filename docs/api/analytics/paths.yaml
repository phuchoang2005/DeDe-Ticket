analytics:
  get:
    tags: [Analytics]
    summary: Retrieve admin analytics report
    security:
      - bearerAuth: []
    parameters:
      - name: days
        in: query
        schema: { type: integer, default: 14 }
    responses:
      '200':
        description: KPI summary, charts, funnel, category mix, and operational signals
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AnalyticsReport'
