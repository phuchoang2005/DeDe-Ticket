Ticket:
  type: object
  properties:
    id:
      type: integer
    order_item_id:
      type: integer
    qr_code:
      type: string
    status:
      type: string
      enum: [VALID, USED, REVOKED]
CheckinRequest:
  type: object
  required:
    - qr_code
  properties:
    qr_code:
      type: string
OfflineSyncRequest:
  type: object
  required:
    - records
  properties:
    records:
      type: array
      items:
        type: object
        properties:
          qr_code:
            type: string
          scanned_at:
            type: string
            format: date-time
