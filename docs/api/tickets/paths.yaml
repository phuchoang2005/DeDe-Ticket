myTickets:
  get:
    tags:
      - Tickets
    summary: Get tickets for the authenticated user
    security:
      - bearerAuth: []
    responses:
      '200':
        description: List of tickets
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../tickets/schemas.yaml#/Ticket'
checkin:
  post:
    tags:
      - Tickets
    summary: Validate a ticket at the gate
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../tickets/schemas.yaml#/CheckinRequest'
    responses:
      '200':
        description: Check-in successful
syncOffline:
  post:
    tags:
      - Tickets
    summary: Sync offline check-in data
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../tickets/schemas.yaml#/OfflineSyncRequest'
    responses:
      '200':
        description: Sync completed successfully
