myTickets:
  get:
    tags:
      - Tickets
    summary: Get tickets for the authenticated user
    security:
      - bearerAuth: []
    responses:
      '200':
        description: List of tickets with their QR codes
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../tickets/schemas.yaml#/Ticket'
checkin:
  post:
    tags:
      - Tickets
    summary: Validate a ticket at the gate
    description: Scans QR code payload. Required to respond in < 5 seconds.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../tickets/schemas.yaml#/CheckinRequest'
    responses:
      '200':
        description: Ticket is valid, check-in successful
      '400':
        description: Invalid or duplicate ticket (fraud prevention)
syncOffline:
  post:
    tags:
      - Tickets
    summary: Sync offline check-in data
    description: Uploads batched check-ins recorded by the mobile app during network outages.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../tickets/schemas.yaml#/OfflineSyncRequest'
    responses:
      '200':
        description: Sync completed successfully
