tickets:
  get:
    tags: [Tickets]
    summary: List tickets for the authenticated user
    description: With no query string the backend keeps the legacy bare array. Supplying `page`, `limit`, or `status` returns a paged envelope with status counts.
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema: { type: integer, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, default: 10 }
      - name: status
        in: query
        schema:
          type: string
          enum: [VALID, USED, CANCELLED]
    responses:
      '200':
        description: Ticket list or paged ticket envelope
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: './schemas.yaml#/TicketView'
                - $ref: './schemas.yaml#/TicketPage'
ticketById:
  get:
    tags: [Tickets]
    summary: Get one of my tickets
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: Ticket detail
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/TicketView'
  delete:
    tags: [Tickets]
    summary: Cancel one of my tickets
    description: Cancels a VALID ticket owned by the caller and releases the underlying seat. USED tickets return 409 `TICKET_ALREADY_USED`; already-cancelled tickets are a no-op.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '204':
        description: Ticket cancelled
scan:
  post:
    tags: [Tickets]
    summary: Scan a ticket at the gate
    description: >
      Requires `ROLE_SCANNER`, `ROLE_ADMIN`, or `ROLE_ORGANIZER`. The optional
      `deviceId` is persisted on `check_ins.device_id` for forensics. Errors:
      404 `TICKET_NOT_FOUND`, 409 `ALREADY_USED` (ticket USED or already checked
      in), 409 `TICKET_NOT_VALID` (ticket not in VALID state).
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/ScanRequest'
    responses:
      '200':
        description: Scan accepted
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ScanResult'
scanHistory:
  get:
    tags: [Tickets]
    summary: Check-in history (staff)
    description: >
      Most-recent-first log of successful check-ins, each with the scanning
      account, device id, ticket, event and seat. Requires `ROLE_SCANNER`,
      `ROLE_ADMIN`, or `ROLE_ORGANIZER`. Only successful check-ins are recorded
      (one row per ticket, enforced by `uk_check_ins_ticket`); failed/duplicate
      scan attempts are not logged.
    security:
      - bearerAuth: []
    parameters:
      - name: limit
        in: query
        description: Max rows to return, clamped to 1..500 (default 100).
        schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
    responses:
      '200':
        description: Check-in history rows
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/ScanHistoryView'
