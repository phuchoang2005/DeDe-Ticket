myTickets:
  get:
    tags:
      - Tickets
    summary: Get tickets for the authenticated user
    description: |
      With no query string this returns the legacy bare array (kept for
      back-compat). When `page`, `limit`, or `status` are supplied, the
      response switches to a paged envelope with status counts so the
      My Tickets UI can render tabs and pagination from a single call.
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
          maximum: 50
      - name: status
        in: query
        required: false
        description: One of VALID, USED, CANCELLED. Omit for all statuses.
        schema:
          type: string
          enum: [VALID, USED, CANCELLED]
    responses:
      '200':
        description: List of tickets (bare array OR paged envelope, see description)
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: '../tickets/schemas.yaml#/Ticket'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../tickets/schemas.yaml#/Ticket'
                    page:
                      type: object
                      properties:
                        page: { type: integer }
                        limit: { type: integer }
                        total: { type: integer }
                        hasMore: { type: boolean }
                    counts:
                      type: object
                      additionalProperties:
                        type: integer
ticketById:
  delete:
    tags:
      - Tickets
    summary: Cancel (soft-delete) one of my tickets
    description: |
      Cancels a ticket the caller owns and releases the underlying seat back
      to AVAILABLE. Allowed for tickets in status VALID. Returns 409
      `TICKET_ALREADY_USED` if the ticket has already been checked in
      (status USED). Already-cancelled tickets succeed as a no-op (idempotent).
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '204':
        description: Ticket cancelled, seat released
      '404':
        description: Ticket not found or not owned by caller
      '409':
        description: Ticket already used and cannot be cancelled
checkin:
  post:
    tags:
      - Tickets
    summary: Validate a ticket at the gate
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../tickets/schemas.yaml#/CheckinRequest'
    responses:
      '200':
        description: Check-in successful
syncOffline:
  post:
    tags:
      - Tickets
    summary: Sync offline check-in data
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../tickets/schemas.yaml#/OfflineSyncRequest'
    responses:
      '200':
        description: Sync completed successfully
