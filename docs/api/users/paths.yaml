me:
  get:
    tags:
      - Users
    summary: Get current user profile
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User profile retrieved
        content:
          application/json:
            schema:
              $ref: '../users/schemas.yaml#/User'
  put:
    tags:
      - Users
    summary: Update current user profile
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../users/schemas.yaml#/UserUpdateRequest'
    responses:
      '200':
        description: Profile updated
        content:
          application/json:
            schema:
              $ref: '../users/schemas.yaml#/User'
