me:
  get:
    tags: [Users]
    summary: Get the authenticated profile
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current user
        content:
          application/json:
            schema:
              $ref: '../auth/schemas.yaml#/UserResponse'
  put:
    tags: [Users]
    summary: Update the authenticated profile
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UserUpdateRequest'
    responses:
      '200':
        description: Updated user
        content:
          application/json:
            schema:
              $ref: '../auth/schemas.yaml#/UserResponse'
