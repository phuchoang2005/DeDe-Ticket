BookingRequest:
  type: object
  required:
    - eventId
    - zoneId
    - quantity
  properties:
    eventId:
      type: string
      format: uuid
    zoneId:
      type: string
    quantity:
      type: integer
      minimum: 1
BookingQueuedResponse:
  type: object
  properties:
    bookingId:
      type: string
      format: uuid
    status:
      type: string
      example: QUEUED
BookingStatusResponse:
  type: object
  properties:
    bookingId:
      type: string
      format: uuid
    status:
      type: string
      enum: [QUEUED, RESERVED, EXPIRED, CONFIRMED]
    reservationExpiresAt:
      type: string
      format: date-time
PaymentRequest:
  type: object
  required:
    - paymentMethod
    - amount
  properties:
    paymentMethod:
      type: string
      example: BANK_TRANSFER
    amount:
      type: number
