  <text x="1370" y="498" font-family="sans-serif" font-size="16" font-weight="bold" fill="#157F19" text-anchor="end">500.000đ</text>
  <text x="998" y="520" font-family="sans-serif" font-size="11" fill="#525252">Hàng F–I, khu vực đứng</text>

  <text x="998" y="548" font-family="sans-serif" font-size="11" fill="#989393">Còn 3.890/4.000 vé</text>
  <text x="1370" y="548" font-family="sans-serif" font-size="11" font-weight="bold" fill="#157F19" text-anchor="end">3% đã bán</text>
  <rect x="998" y="554" width="372" height="6" rx="3" fill="#F0F0F0"/>
  <rect x="998" y="554" width="10" height="6" rx="3" fill="#B6E8BC"/>
  <text x="998" y="580" font-family="monospace" font-size="10" fill="#989393">quantity=4000 · sold_quantity=110</text>

  <!-- Total availability -->
  <rect x="980" y="612" width="400" height="60" rx="10" fill="#F8F8F8"/>
  <text x="996" y="634" font-family="sans-serif" font-size="11" fill="#989393">Tổng sức chứa</text>
  <text x="996" y="652" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B3120">4.326 / 6.000 vé còn trống</text>
  <text x="1370" y="652" font-family="sans-serif" font-size="11" font-weight="bold" fill="#157F19" text-anchor="end">SUM(quantity − sold_quantity)</text>

  <!-- Status-aware CTA -->
  <rect x="980" y="690" width="400" height="56" rx="10" fill="#157F19"/>
  <text x="1180" y="724" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Chọn ghế →</text>

  <text x="1180" y="768" font-family="sans-serif" font-size="11" fill="#989393" text-anchor="middle">CTA bị ẩn khi EVENTS.status ∈ {DRAFT, CANCELLED, COMPLETED}</text>

  <line x1="980" y1="790" x2="1380" y2="790" stroke="#E3E3E3"/>

  <!-- Safety notes -->
