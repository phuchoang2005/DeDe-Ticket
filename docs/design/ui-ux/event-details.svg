  <text x="1000" y="842" font-family="sans-serif" font-size="11" fill="#525252">Mỗi QR code là duy nhất (TICKETS.qr_code UNIQUE)</text>
  <circle cx="990" cy="858" r="3" fill="#157F19"/>
  <text x="1000" y="862" font-family="sans-serif" font-size="11" fill="#525252">Tự động hoàn tiền nếu hệ thống lỗi (ORDERS → REFUND_PENDING)</text>
  <circle cx="990" cy="878" r="3" fill="#157F19"/>
  <text x="1000" y="882" font-family="sans-serif" font-size="11" fill="#525252">Giữ ghế 15 phút trong lúc thanh toán (EVENT_SEATS.locked_until)</text>
  <circle cx="990" cy="898" r="3" fill="#157F19"/>
  <text x="1000" y="902" font-family="sans-serif" font-size="11" fill="#525252">Hỗ trợ MoMo / VNPay / Visa-Master (PAYMENTS.provider)</text>

  <text x="1180" y="952" font-family="sans-serif" font-size="11" fill="#989393" text-anchor="middle">Schema: EVENTS · TICKET_TYPES · EVENT_CATEGORY_MAP · VENUES</text>
