  <rect x="236" y="772" width="92" height="26" rx="13" fill="#E8F5E9"/>
  <text x="282" y="789" font-family="sans-serif" font-size="11" font-weight="bold" fill="#157F19" text-anchor="middle">Mỹ Tâm</text>
