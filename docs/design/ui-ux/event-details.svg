  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#157F19" stop-opacity="0"/>
      <stop offset="100%" stop-color="#157F19" stop-opacity="0.3"/>
