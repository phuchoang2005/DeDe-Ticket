  <text x="40" y="714" font-family="sans-serif" font-size="13" fill="#525252">Đại nhạc hội Mùa Hè 2026 quy tụ hơn 20 nghệ sĩ hàng đầu Việt Nam và quốc tế. Với sân khấu</text>
  <text x="40" y="732" font-family="sans-serif" font-size="13" fill="#525252">ngoài trời lớn nhất từ trước đến nay, đêm diễn hứa hẹn mang đến trải nghiệm âm nhạc</text>
  <text x="40" y="750" font-family="sans-serif" font-size="13" fill="#525252">và hình ảnh đỉnh cao. (EVENTS.description, rút gọn 2 dòng đầu — xem thêm bên dưới)</text>

