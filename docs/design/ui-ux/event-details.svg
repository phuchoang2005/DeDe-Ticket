  <text x="1370" y="412" font-family="sans-serif" font-size="11" font-weight="bold" fill="#157F19" text-anchor="end">72% đã bán</text>
  <rect x="998" y="418" width="372" height="6" rx="3" fill="#F0F0F0"/>
