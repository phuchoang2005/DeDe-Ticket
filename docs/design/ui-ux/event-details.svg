  <circle cx="780" cy="180" r="60" fill="#157F19" opacity="0.18"/>
  <circle cx="680" cy="380" r="120" fill="#157F19" opacity="0.08"/>
  <text x="490" y="240" font-family="sans-serif" font-size="48" font-weight="bold" fill="#157F19" text-anchor="middle">ĐẠI NHẠC HỘI</text>
  <text x="490" y="288" font-family="sans-serif" font-size="48" font-weight="bold" fill="#1B3120" text-anchor="middle">MÙA HÈ 2026</text>

