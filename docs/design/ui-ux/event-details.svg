  <text x="118" y="594" font-family="sans-serif" font-size="11" fill="#989393">Tổ chức bởi</text>
  <text x="118" y="612" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B3120">DV Entertainment</text>
  <text x="118" y="628" font-family="sans-serif" font-size="11" fill="#525252">12 sự kiện đã tổ chức · 4.8 ★ từ 2.341 đánh giá · USERS.id = 1042</text>
  <rect x="788" y="586" width="132" height="36" rx="8" fill="white" stroke="#157F19"/>
  <text x="854" y="608" font-family="sans-serif" font-size="12" font-weight="bold" fill="#157F19" text-anchor="middle">Theo dõi BTC</text>

