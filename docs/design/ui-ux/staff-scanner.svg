  <!-- Bottom annotations -->
  <rect x="40" y="850" width="1360" height="140" rx="12" fill="white" stroke="#E3E3E3"/>
  <text x="60" y="876" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B3120">Hợp đồng triển khai</text>
  <text x="60" y="900" font-family="sans-serif" font-size="11" fill="#525252">• Pre-fetch tất cả TICKETS của event_id vào SQLite local trước khi mất mạng (2h trước event)</text>
  <text x="60" y="918" font-family="sans-serif" font-size="11" fill="#525252">• POST /tickets/sync-offline { pending_checkins[] } với idempotency key cho mỗi row</text>
  <text x="60" y="936" font-family="sans-serif" font-size="11" fill="#525252">• Server xử lý ON DUPLICATE KEY trên CHECK_INS.ticket_id → giữ scan sớm nhất, ghi AUDIT_LOGS cho duplicate</text>
  <text x="60" y="954" font-family="sans-serif" font-size="11" fill="#525252">• PO §2.4: app phải hoạt động hoàn toàn không cần mạng trong &gt; 30 phút · chống chậm cổng vào</text>
  <text x="60" y="972" font-family="sans-serif" font-size="11" fill="#989393">Schema: TICKETS · CHECK_INS · AUDIT_LOGS · design-supplement.md §4</text>
